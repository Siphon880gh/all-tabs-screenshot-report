<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Tab Report</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <nav class="popup-menu" aria-label="Report options">
      <button type="button" id="btn-with-screenshots" class="popup-option popup-option-primary">
        Create report with screenshots
      </button>
      <button type="button" id="btn-without-screenshots" class="popup-option popup-option-secondary">
        Create report without screenshots
      </button>
    </nav>
    <p id="popup-status" class="popup-status" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
