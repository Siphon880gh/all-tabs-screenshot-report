<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Screenshot Report</title>
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <header class="report-header">
      <h1>Tab Screenshot Report</h1>
      <p id="report-meta" class="report-meta">Loading report…</p>
      <p class="report-hint">Drag a card to reorder (compact thumbnails while dragging) · Delete removes it from this report</p>
    </header>
    <main id="report-root" class="report-root"></main>
    <p id="report-empty" class="report-empty" hidden>No report data found. Click the extension icon to generate a report.</p>
    <script src="report.js"></script>
  </body>
</html>
